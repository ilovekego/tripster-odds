<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingori Tipster | Premium Sports Predictions</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0ea5e9', // Switched to a unique premium blue instead of the copied green
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; padding-bottom: 100px; }
        .blurred-text { filter: blur(5px); user-select: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .hidden { display: none !important; }
        .date-btn.active { background-color: #0ea5e9; color: white; border-color: #0ea5e9; font-weight: bold; }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Header -->
    <header class="bg-darkbg border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter uppercase flex items-center gap-2">
                <i class="fa-solid fa-bolt text-brand"></i>
                KINGORI <span class="text-brand font-light">TIPSTER</span>
            </h1>
            <div id="admin-badge" class="hidden text-xs bg-red-500 text-white px-2 py-1 rounded font-bold uppercase tracking-wider">
                <i class="fa-solid fa-user-shield"></i> Admin
            </div>
        </div>
    </header>

    <!-- USER VIEW -->
    <div id="user-view">
        <!-- Unique Hero Section -->
        <section class="px-4 pt-8 pb-6 border-b border-slate-800 bg-gradient-to-b from-slate-900 to-[#020617]">
            <div class="max-w-md mx-auto text-center">
                <h2 class="text-3xl font-black mb-2 uppercase tracking-tight text-white">Elite Betting Intelligence</h2>
                <p class="text-slate-400 text-sm mb-6">Gain the edge with our professional market analysis and premium slip builders.</p>
            </div>
        </section>

        <!-- Date Selector -->
        <div class="max-w-md mx-auto px-4 py-4">
            <div class="flex overflow-x-auto gap-2 pb-2" id="date-slider">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Feed -->
        <main class="max-w-md mx-auto p-4 pt-0" id="tips-container">
            <div class="text-center text-slate-500 py-10" id="loading-state">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-brand"></i>
                <p>Loading market data...</p>
            </div>
        </main>
    </div>

    <!-- ADMIN VIEW -->
    <main class="max-w-md mx-auto p-4 hidden" id="admin-panel">
        <div class="bg-cardbg p-6 rounded-xl border border-slate-700">
            <h2 class="text-xl font-bold mb-4 border-b border-slate-700 pb-2 text-white"><i class="fa-solid fa-pen-to-square text-brand mr-2"></i>Publish Tip</h2>
            <form id="admin-form" onsubmit="publishTip(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Home Team</label>
                        <input type="text" id="homeTeam" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Away Team</label>
                        <input type="text" id="awayTeam" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-brand">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">League (e.g. Premier League)</label>
                        <input type="text" id="league" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Market Category</label>
                        <select id="category" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-brand">
                            <option value="Teams to Win">Teams to Win</option>
                            <option value="Over 2.5">Goals Market</option>
                            <option value="Both Teams to Score">BTTS</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Prediction</label>
                        <input type="text" id="prediction" placeholder="e.g. Home Win" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Odds</label>
                        <input type="number" step="0.01" id="odds" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-brand">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Kickoff Time</label>
                    <input type="datetime-local" id="kickoffTime" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-brand" style="color-scheme: dark;">
                </div>

                <div class="flex items-center mt-2 bg-slate-800 p-3 rounded border border-slate-700">
                    <input type="checkbox" id="isFree" class="w-5 h-5 text-brand bg-slate-900 border-slate-600 rounded focus:ring-brand">
                    <label class="ml-2 text-sm text-slate-300 font-bold">Set as Free Preview Tip</label>
                </div>

                <button type="submit" id="publish-btn" class="w-full bg-brand hover:bg-sky-400 text-white font-bold py-3 rounded-lg mt-4 transition-colors">
                    <i class="fa-solid fa-paper-plane mr-2"></i>Publish to Server
                </button>
            </form>
        </div>
    </main>

    <!-- Floating Checkout Bar -->
    <div id="checkout-bar" class="fixed bottom-0 left-0 w-full bg-cardbg border-t border-slate-700 p-4 transform translate-y-full transition-transform duration-300 z-50 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.5)]">
        <div class="max-w-md mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center text-white">
                <span id="selected-count" class="font-semibold text-sm text-slate-400">0 Picks Selected</span>
                <span class="text-lg font-bold">Total: <span id="total-price" class="text-brand">0 KES</span></span>
            </div>
            
            <div class="flex gap-2">
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fa-solid fa-mobile-screen text-slate-500"></i>
                    </div>
                    <input type="tel" id="phone-input" placeholder="07XXXXXXXX" class="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-brand focus:border-brand block w-full pl-10 p-3 outline-none">
                </div>
                <button onclick="processPayment()" id="pay-btn" class="bg-brand hover:bg-sky-400 text-white font-bold py-3 px-6 rounded-lg transition-colors whitespace-nowrap flex items-center gap-2">
                    <i class="fa-solid fa-unlock"></i> Pay
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- VARIABLES DECLARED AT THE TOP TO FIX REFERENCE ERROR ---
        let tipsData = [];
        let selectedTipIds = new Set();
        let currentTotal = 0;
        let currentDateFilter = new Date().toISOString().split('T')[0];
        
        const API_URL = 'https://tripster-8090c6bbfe5f.herokuapp.com/api';
        
        // --- ROUTING LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'tripster';

        if (isAdmin) {
            document.getElementById('user-view').classList.add('hidden');
            document.getElementById('checkout-bar').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('admin-badge').classList.remove('hidden');
        } else {
            generateDates();
            loadTips(); 
        }

        function showToast(message, type = 'success') {
            Toastify({
                text: message,
                duration: 4000,
                gravity: "top", position: "center",
                style: { background: type === 'success' ? "#0ea5e9" : "#ef4444", color: "#fff", borderRadius: "8px", fontWeight: "bold" }
            }).showToast();
        }

        // --- DATE SLIDER LOGIC ---
        function generateDates() {
            const slider = document.getElementById('date-slider');
            slider.innerHTML = '';
            
            for(let i = -1; i <= 5; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateString = d.toISOString().split('T')[0];
                
                let label = '';
                if(i === -1) label = 'Yesterday';
                else if (i === 0) label = 'Today';
                else if (i === 1) label = 'Tomorrow';
                else label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

                const isActive = dateString === currentDateFilter ? 'active' : 'text-slate-400 border border-slate-700 bg-slate-900';
                
                slider.innerHTML += `
                    <button onclick="filterByDate('${dateString}')" class="date-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm transition-colors ${isActive}" data-date="${dateString}">
                        ${label}
                    </button>
                `;
            }
        }

        function filterByDate(dateStr) {
            currentDateFilter = dateStr;
            generateDates(); 
            renderTips(); 
        }

        // --- ADMIN FUNCTIONS ---
        async function publishTip(e) {
            e.preventDefault();
            const btn = document.getElementById('publish-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Publishing...';
            btn.disabled = true;

            const payload = {
                homeTeam: document.getElementById('homeTeam').value,
                awayTeam: document.getElementById('awayTeam').value,
                league: document.getElementById('league').value, // League is back
                category: document.getElementById('category').value, // Used for grouping
                kickoffTime: document.getElementById('kickoffTime').value,
                prediction: document.getElementById('prediction').value,
                odds: parseFloat(document.getElementById('odds').value),
                isFree: document.getElementById('isFree').checked
            };

            try {
                // Adjusting payload slightly to map category to your existing backend schema if needed, 
                // but assuming your schema handles it or uses 'league' field flexibly.
                const response = await fetch(`${API_URL}/admin/publish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'admin_user': 'tripster', 'admin_pass': 'tripster2026' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    showToast("Tip published successfully!");
                    document.getElementById('admin-form').reset();
                } else {
                    showToast("Failed to publish tip.", "error");
                }
            } catch (error) {
                showToast("Server error.", "error");
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Publish to Server';
                btn.disabled = false;
            }
        }

        // --- USER FUNCTIONS ---
        async function loadTips() {
            try {
                const response = await fetch(`${API_URL}/tips`);
                tipsData = await response.json();
                
                if(tipsData.length === 0) {
                    tipsData = [
                        { _id: '1', homeTeam: 'Arsenal', awayTeam: 'Chelsea', kickoffTime: new Date().toISOString(), prediction: 'Home Win', odds: 2.10, isFree: true, category: 'Teams to Win', league: 'Premier League' },
                        { _id: '3', homeTeam: 'Juventus', awayTeam: 'AC Milan', kickoffTime: new Date().toISOString(), prediction: 'LOCKED', odds: 'LOCKED', price: 125, isFree: false, category: 'Teams to Win', league: 'Serie A' }
                    ];
                }
                renderTips();
            } catch (error) {
                document.getElementById('loading-state').innerHTML = '<p class="text-red-500 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Server offline</p>';
            }
        }

        function renderTips() {
            const container = document.getElementById('tips-container');
            container.innerHTML = '';

            const filteredTips = tipsData.filter(tip => tip.kickoffTime.startsWith(currentDateFilter));
            
            // Using a generic rendering approach so any category works
            const groupedTips = {};
            filteredTips.forEach(tip => {
                const cat = tip.category || 'Match Winner';
                if(!groupedTips[cat]) groupedTips[cat] = [];
                groupedTips[cat].push(tip);
            });

            if(Object.keys(groupedTips).length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-sm text-slate-500 bg-cardbg rounded-xl border border-slate-800">No predictions published for this date yet.</div>`;
                return;
            }

            for (const [categoryName, catTips] of Object.entries(groupedTips)) {
                let html = `
                    <div class="bg-cardbg rounded-xl border border-slate-700 p-4 mb-6">
                        <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
                            <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-futbol text-brand mr-2"></i>${categoryName}</h3>
                            <span class="bg-slate-800 text-slate-400 text-xs px-2 py-1 rounded font-semibold">${catTips.length} Picks</span>
                        </div>
                `;

                catTips.forEach(tip => {
                    const time = new Date(tip.kickoffTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    if(tip.isFree) {
                        html += `
                            <div class="mb-4 bg-slate-900 rounded-lg p-3 border border-slate-700">
                                <div class="flex justify-between items-center text-xs text-slate-400 mb-2 font-semibold">
                                    <span>${tip.league} • ${time}</span>
                                    <span class="text-brand"><i class="fa-solid fa-unlock mr-1"></i>FREE</span>
                                </div>
                                <div class="flex justify-between items-center mb-3">
                                    <div class="font-bold text-white text-sm">${tip.homeTeam}</div>
                                    <div class="text-xs text-slate-500 px-2">vs</div>
                                    <div class="font-bold text-white text-sm">${tip.awayTeam}</div>
                                </div>
                                <div class="flex justify-between items-center bg-brand/10 p-2 rounded border border-brand/20">
                                    <span class="font-bold text-brand text-sm">${tip.prediction}</span>
                                    <span class="font-bold text-white text-sm">${tip.odds}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="mb-4 bg-slate-900 rounded-lg p-3 border border-slate-700 relative" id="card-${tip._id}">
                                <div class="flex justify-between items-center text-xs text-slate-400 mb-2 font-semibold">
                                    <span>${tip.league} • ${time}</span>
                                    <label class="flex items-center cursor-pointer bg-slate-800 px-2 py-1 rounded hover:bg-slate-700 transition">
                                        <input type="checkbox" class="w-4 h-4 text-brand bg-slate-900 border-slate-600 rounded focus:ring-brand" onchange="toggleCart('${tip._id}', ${tip.price}, this)">
                                        <span class="ml-1 text-slate-300">Select</span>
                                    </label>
                                </div>
                                <div class="flex justify-between items-center mb-3">
                                    <div class="font-bold text-white text-sm">${tip.homeTeam}</div>
                                    <div class="text-xs text-slate-500 px-2">vs</div>
                                    <div class="font-bold text-white text-sm">${tip.awayTeam}</div>
                                </div>
                                <div class="flex justify-between items-center bg-slate-800 p-2 rounded border border-slate-700">
                                    <span class="font-bold text-slate-500 blurred-text text-sm">Home Win</span>
                                    <span class="text-xs font-bold text-white bg-slate-700 px-2 py-1 rounded"><i class="fa-solid fa-lock text-brand mr-1"></i> KES ${tip.price}</span>
                                </div>
                            </div>
                        `;
                    }
                });
                
                html += `</div>`;
                container.innerHTML += html;
            }
        }

        function toggleCart(tipId, price, checkbox) {
            if(checkbox.checked) {
                selectedTipIds.add(tipId);
                currentTotal += price;
            } else {
                selectedTipIds.delete(tipId);
                currentTotal -= price;
            }
            const bar = document.getElementById('checkout-bar');
            document.getElementById('selected-count').innerText = `${selectedTipIds.size} Picks Selected`;
            document.getElementById('total-price').innerText = `${currentTotal} KES`;
            
            selectedTipIds.size > 0 ? bar.classList.remove('translate-y-full') : bar.classList.add('translate-y-full');
        }

        async function processPayment() {
            showToast("STK Push Initiated. Check your phone.");
            setTimeout(() => {
                showToast("Payment Received! Unlocking...");
                selectedTipIds.forEach(id => {
                    const card = document.getElementById(`card-${id}`);
                    if(card) {
                        card.innerHTML = card.innerHTML.replace('blurred-text', 'text-brand').replace('text-slate-500', 'text-brand').replace('Home Win', 'Premium Pick').replace(/<label.*<\/label>/s, '').replace(/KES \d+/, 'UNLOCKED');
                    }
                });
                selectedTipIds.clear();
                currentTotal = 0;
                document.getElementById('checkout-bar').classList.add('translate-y-full');
            }, 3000);
        }
    </script>
</body>
</html>
