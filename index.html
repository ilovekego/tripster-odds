<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Suspended</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #051024; /* Dark navy */
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .container {
            border: 3px solid #ef4444; /* Alert red */
            padding: 50px 40px;
            border-radius: 12px;
            background-color: #0a1936;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            color: #ef4444;
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
        }
        .message {
            font-size: 1.5rem;
            color: #e3b778; /* Bronze */
            margin: 0 0 30px 0;
            font-weight: bold;
        }
        .developer-tag {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Suspended</h1>
        <div class="message">FUCK YOU. Ulambwe na Siafu.</div>
        <div class="developer-tag">
            Developed by Vinnie Digital Hub<br>
            🖕next time utumie akili kama mtu mkubwa
        </div>
    </div>
</body>
</html>
