<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingori Tipster | Mega Odds</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <!-- Unique Fonts: Oswald for sports headers, Inter for readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#020b1e',
                        navybox: '#0f1c35',
                        navylight: '#1a2b4c',
                        gold: '#facc15', // Matches the vibrant yellow/gold from the image
                        golddark: '#ca8a04',
                        betgreen: '#16a34a'
                    },
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        oswald: ['Oswald', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020b1e; color: #f8fafc; padding-bottom: 100px; background-image: radial-gradient(#1a2b4c 1px, transparent 1px); background-size: 30px 30px; }
        .blurred-text { filter: blur(5px); user-select: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
        .hidden { display: none !important; }
        .date-btn.active { background-color: #facc15; color: #020b1e; border-color: #facc15; font-weight: bold; }
        
        /* Specialized borders matching the image style */
        .gold-border-box { border: 2px solid #ca8a04; outline: 1px solid #facc15; outline-offset: -4px; }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Navigation Bar -->
    <nav class="bg-navy border-b-2 border-gold sticky top-0 z-50 shadow-[0_4px_15px_rgba(250,204,21,0.1)]">
        <div class="max-w-4xl mx-auto flex justify-between items-center p-3">
            <h1 class="text-2xl font-oswald font-bold tracking-wider uppercase flex items-center gap-2 text-white">
                <i class="fa-solid fa-crown text-gold"></i>
                KINGORI <span class="text-gold">TIPSTER</span>
            </h1>
            <div class="flex gap-4 items-center">
                <a href="#" class="text-sm font-bold hover:text-gold transition-colors hidden sm:block">HOME</a>
                <a href="#" class="text-sm font-bold text-gold hover:text-white transition-colors hidden sm:block">MEGA SLIPS</a>
                <i class="fa-solid fa-bars text-gold text-xl cursor-pointer sm:hidden"></i>
                <div id="admin-badge" class="hidden text-xs bg-red-600 text-white px-2 py-1 rounded font-bold uppercase tracking-wider">
                    Admin
                </div>
            </div>
        </div>
    </nav>

    <!-- USER VIEW -->
    <div id="user-view">
        <!-- Date Selector -->
        <div class="max-w-4xl mx-auto px-4 py-6">
            <div class="flex overflow-x-auto gap-2 pb-2" id="date-slider">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Feed Container -->
        <main class="max-w-4xl mx-auto px-4 pb-10" id="tips-container">
            <div class="text-center text-slate-500 py-10" id="loading-state">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 text-gold"></i>
                <p class="font-oswald text-xl tracking-wide uppercase">Compiling Odds...</p>
            </div>
        </main>
    </div>

    <!-- ADMIN VIEW -->
    <main class="max-w-md mx-auto p-4 hidden mt-6" id="admin-panel">
        <div class="bg-navybox p-6 rounded-xl border-2 border-gold shadow-lg">
            <h2 class="text-2xl font-oswald font-bold mb-4 border-b border-navylight pb-2 text-white uppercase tracking-wide"><i class="fa-solid fa-pen-to-square text-gold mr-2"></i>Publish Tip</h2>
            <form id="admin-form" onsubmit="publishTip(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Home Team</label>
                        <input type="text" id="homeTeam" required class="w-full bg-navy border border-navylight rounded p-2 text-white outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Away Team</label>
                        <input type="text" id="awayTeam" required class="w-full bg-navy border border-navylight rounded p-2 text-white outline-none focus:border-gold">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">League</label>
                        <input type="text" id="league" required placeholder="e.g. EPL" class="w-full bg-navy border border-navylight rounded p-2 text-white outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Category</label>
                        <select id="category" class="w-full bg-navy border border-navylight rounded p-2 text-white outline-none focus:border-gold">
                            <option value="Match Winner">Match Winner</option>
                            <option value="Draws">Draws</option>
                            <option value="Overs & Unders">Overs & Unders</option>
                            <option value="Both Teams to Score">Both Teams to Score</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Prediction</label>
                        <input type="text" id="prediction" placeholder="e.g. ARSENAL WIN" required class="w-full bg-navy border border-navylight rounded p-2 text-white outline-none focus:border-gold font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Odds</label>
                        <input type="number" step="0.01" id="odds" required class="w-full bg-navy border border-navylight rounded p-2 text-white outline-none focus:border-gold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Kickoff Time</label>
                    <input type="datetime-local" id="kickoffTime" required class="w-full bg-navy border border-navylight rounded p-2 text-white outline-none focus:border-gold" style="color-scheme: dark;">
                </div>

                <div class="flex items-center mt-2 bg-navylight p-3 rounded border border-slate-700">
                    <input type="checkbox" id="isFree" class="w-5 h-5 text-gold bg-navy border-slate-600 rounded focus:ring-gold">
                    <label class="ml-2 text-sm text-gold font-bold uppercase tracking-wider">Set as Free Preview Tip</label>
                </div>

                <button type="submit" id="publish-btn" class="w-full bg-gold hover:bg-yellow-300 text-navy font-black py-3 rounded mt-4 transition-colors uppercase tracking-widest text-lg">
                    <i class="fa-solid fa-paper-plane mr-2"></i>Publish Pick
                </button>
            </form>
        </div>
    </main>

    <!-- Floating Checkout Bar -->
    <div id="checkout-bar" class="fixed bottom-0 left-0 w-full bg-navybox border-t-2 border-gold p-4 transform translate-y-full transition-transform duration-300 z-50 shadow-[0_-10px_30px_rgba(250,204,21,0.15)]">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-white flex flex-col">
                <span id="selected-count" class="font-bold text-sm text-slate-400 uppercase tracking-wider">0 Picks Selected</span>
                <span class="text-xl font-oswald font-bold tracking-wide">TOTAL: <span id="total-price" class="text-gold">0 KES</span></span>
            </div>
            
            <div class="flex w-full sm:w-auto gap-2">
                <div class="relative w-full sm:w-48">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fa-solid fa-mobile-screen text-slate-400"></i>
                    </div>
                    <input type="tel" id="phone-input" placeholder="07XXXXXXXX" class="bg-navy border border-navylight text-white font-bold text-sm rounded focus:ring-gold focus:border-gold block w-full pl-10 p-3 outline-none">
                </div>
                <button onclick="processPayment()" id="pay-btn" class="bg-gold hover:bg-yellow-300 text-navy font-black py-3 px-6 rounded transition-colors whitespace-nowrap flex items-center gap-2 uppercase tracking-wider">
                    <i class="fa-solid fa-unlock"></i> Unlock Slips
                </button>
            </div>
        </div>
    </div>

    <script>
        let tipsData = [];
        let selectedTipIds = new Set();
        let currentTotal = 0;
        let currentDateFilter = new Date().toISOString().split('T')[0];
        
        const API_URL = 'https://tripster-8090c6bbfe5f.herokuapp.com/api';
        
        // --- ROUTING LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'tripster';

        if (isAdmin) {
            document.getElementById('user-view').classList.add('hidden');
            document.getElementById('checkout-bar').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('admin-badge').classList.remove('hidden');
        } else {
            generateDates();
            loadTips(); 
        }

        function showToast(message, type = 'success') {
            Toastify({
                text: message,
                duration: 4000,
                gravity: "top", position: "center",
                style: { background: type === 'success' ? "#facc15" : "#ef4444", color: type === 'success' ? "#020b1e" : "#fff", borderRadius: "4px", fontWeight: "bold", textTransform: "uppercase" }
            }).showToast();
        }

        // --- DATE SLIDER LOGIC ---
        function generateDates() {
            const slider = document.getElementById('date-slider');
            slider.innerHTML = '';
            
            for(let i = -1; i <= 5; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateString = d.toISOString().split('T')[0];
                
                let label = '';
                if(i === -1) label = 'YESTERDAY';
                else if (i === 0) label = 'TODAY';
                else if (i === 1) label = 'TOMORROW';
                else label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();

                const isActive = dateString === currentDateFilter ? 'active shadow-[0_0_10px_rgba(250,204,21,0.5)]' : 'text-slate-400 border border-navylight bg-navybox hover:border-gold/50';
                
                slider.innerHTML += `
                    <button onclick="filterByDate('${dateString}')" class="date-btn whitespace-nowrap px-5 py-2 rounded font-bold tracking-wider text-sm transition-all ${isActive}" data-date="${dateString}">
                        ${label}
                    </button>
                `;
            }
        }

        function filterByDate(dateStr) {
            currentDateFilter = dateStr;
            generateDates(); 
            renderTips(); 
        }

        // --- ADMIN FUNCTIONS ---
        async function publishTip(e) {
            e.preventDefault();
            const btn = document.getElementById('publish-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>PUBLISHING...';
            btn.disabled = true;

            const payload = {
                homeTeam: document.getElementById('homeTeam').value,
                awayTeam: document.getElementById('awayTeam').value,
                league: document.getElementById('league').value,
                category: document.getElementById('category').value,
                kickoffTime: document.getElementById('kickoffTime').value,
                prediction: document.getElementById('prediction').value.toUpperCase(), // Force uppercase for UI impact
                odds: parseFloat(document.getElementById('odds').value),
                isFree: document.getElementById('isFree').checked
            };

            try {
                const response = await fetch(`${API_URL}/admin/publish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'admin_user': 'tripster', 'admin_pass': 'tripster2026' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    showToast("Tip published successfully!");
                    document.getElementById('admin-form').reset();
                } else {
                    showToast("Failed to publish tip.", "error");
                }
            } catch (error) {
                showToast("Server error.", "error");
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Publish Pick';
                btn.disabled = false;
            }
        }

        // --- USER FUNCTIONS ---
        async function loadTips() {
            try {
                const response = await fetch(`${API_URL}/tips`);
                tipsData = await response.json();
                
                if(tipsData.length === 0) {
                    // MOCK DATA mapped exactly to the required categories
                    tipsData = [
                        { _id: '1', homeTeam: 'Arsenal', awayTeam: 'Chelsea', kickoffTime: new Date().toISOString(), prediction: 'ARSENAL WIN', odds: 2.10, isFree: true, category: 'Match Winner', league: 'EPL' },
                        { _id: '2', homeTeam: 'Man City', awayTeam: 'Liverpool', kickoffTime: new Date().toISOString(), prediction: 'DRAW', odds: 3.40, isFree: true, category: 'Draws', league: 'EPL' },
                        { _id: '3', homeTeam: 'Juventus', awayTeam: 'AC Milan', kickoffTime: new Date().toISOString(), prediction: 'LOCKED', odds: 'LOCKED', price: 125, isFree: false, category: 'Match Winner', league: 'Serie A' },
                        { _id: '4', homeTeam: 'Real Madrid', awayTeam: 'Barcelona', kickoffTime: new Date().toISOString(), prediction: 'LOCKED', odds: 'LOCKED', price: 150, isFree: false, category: 'Overs & Unders', league: 'La Liga' },
                        { _id: '5', homeTeam: 'Bayern', awayTeam: 'Dortmund', kickoffTime: new Date().toISOString(), prediction: 'YES', odds: 1.65, isFree: true, category: 'Both Teams to Score', league: 'Bundesliga' }
                    ];
                }
                renderTips();
            } catch (error) {
                document.getElementById('loading-state').innerHTML = '<p class="text-red-500 font-bold uppercase tracking-wider"><i class="fa-solid fa-triangle-exclamation"></i> Server offline</p>';
            }
        }

        function renderTips() {
            const container = document.getElementById('tips-container');
            container.innerHTML = '';

            const filteredTips = tipsData.filter(tip => tip.kickoffTime.startsWith(currentDateFilter));
            
            // Define strict category order
            const categoryOrder = ['Match Winner', 'Draws', 'Overs & Unders', 'Both Teams to Score'];
            const groupedTips = {};
            
            filteredTips.forEach(tip => {
                const cat = tip.category || 'Match Winner';
                if(!groupedTips[cat]) groupedTips[cat] = [];
                groupedTips[cat].push(tip);
            });

            if(Object.keys(groupedTips).length === 0) {
                container.innerHTML = `<div class="text-center py-10 font-bold text-slate-500 uppercase tracking-widest bg-navybox rounded border border-navylight">No markets published for this date.</div>`;
                return;
            }

            categoryOrder.forEach(categoryName => {
                if(!groupedTips[categoryName]) return;
                const catTips = groupedTips[categoryName];

                // Calculate cumulative odds for the header like the image
                let categoryOdds = 0;
                catTips.forEach(t => { if(typeof t.odds === 'number') categoryOdds += t.odds; });
                const oddsDisplay = categoryOdds > 0 ? categoryOdds.toFixed(2) : 'MEGA';

                // Section Header mimicking the image's gold borders and dark background layout[cite: 8]
                let html = `
                    <div class="mb-8">
                        <div class="gold-border-box bg-navybox p-2 mb-4 text-center shadow-[0_0_15px_rgba(250,204,21,0.1)]">
                            <h2 class="text-gold font-oswald font-bold text-xl tracking-widest uppercase flex justify-center items-center gap-2">
                                <i class="fa-solid fa-star text-sm"></i> 
                                ${categoryName.toUpperCase()} • TOTAL ODDS: ${oddsDisplay}
                                <i class="fa-solid fa-star text-sm"></i>
                            </h2>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                `;

                catTips.forEach((tip, index) => {
                    const time = new Date(tip.kickoffTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    if(tip.isFree) {
                        // Free Pick Row mapping the layout: Dark bar, team names left, bright gold box on the right[cite: 8]
                        html += `
                            <div class="flex justify-between items-stretch bg-navybox border-l-4 border-gold shadow-md">
                                <div class="flex flex-col justify-center p-3 w-full">
                                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">${tip.league} • ${time}</div>
                                    <div class="font-bold text-white text-sm tracking-wide flex items-center gap-2">
                                        <i class="fa-solid fa-futbol text-slate-500"></i>
                                        ${tip.homeTeam} <span class="text-gold text-xs px-1">VS</span> ${tip.awayTeam}
                                    </div>
                                </div>
                                <div class="bg-gold text-navy font-black text-sm px-4 flex flex-col justify-center items-center text-center shadow-inner border-l border-golddark min-w-[100px]">
                                    <span class="leading-tight">${tip.prediction}</span>
                                    <span class="text-[10px] bg-navy/10 px-2 rounded-full mt-1">ODDS: ${tip.odds}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        // Locked Pick Row
                        html += `
                            <div class="flex justify-between items-stretch bg-navybox border-l-4 border-slate-600 shadow-md relative" id="card-${tip._id}">
                                <div class="flex flex-col justify-center p-3 w-full pl-10 relative">
                                    <input type="checkbox" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 accent-gold cursor-pointer" onchange="toggleCart('${tip._id}', ${tip.price}, this)">
                                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">${tip.league} • ${time}</div>
                                    <div class="font-bold text-white text-sm tracking-wide flex items-center gap-2">
                                        <i class="fa-solid fa-futbol text-slate-500"></i>
                                        ${tip.homeTeam} <span class="text-slate-500 text-xs px-1">VS</span> ${tip.awayTeam}
                                    </div>
                                </div>
                                <div class="bg-slate-800 text-slate-400 font-black text-sm px-4 flex flex-col justify-center items-center text-center border-l border-slate-700 min-w-[100px]">
                                    <i class="fa-solid fa-lock text-gold mb-1"></i>
                                    <span class="leading-tight">KES ${tip.price}</span>
                                </div>
                            </div>
                        `;
                    }
                });
                
                // Add the Bet Now button specifically at the bottom of each category block
                html += `
                        </div>
                        <a href="https://betika.com" target="_blank" class="block w-full text-center bg-betgreen hover:bg-green-500 text-white font-black uppercase tracking-widest py-3 rounded-sm shadow-lg mt-4 border-b-4 border-green-700 transition-all">
                            <i class="fa-solid fa-money-bill-wave mr-2"></i> Bet Now on Betika
                        </a>
                    </div>`;
                
                container.innerHTML += html;
            });
        }

        function toggleCart(tipId, price, checkbox) {
            if(checkbox.checked) {
                selectedTipIds.add(tipId);
                currentTotal += price;
            } else {
                selectedTipIds.delete(tipId);
                currentTotal -= price;
            }
            const bar = document.getElementById('checkout-bar');
            document.getElementById('selected-count').innerText = `${selectedTipIds.size} Picks Selected`;
            document.getElementById('total-price').innerText = `${currentTotal} KES`;
            
            selectedTipIds.size > 0 ? bar.classList.remove('translate-y-full') : bar.classList.add('translate-y-full');
        }

        async function processPayment() {
            showToast("STK Push Initiated. Enter PIN on phone.");
            setTimeout(() => {
                showToast("Payment Verified! Unlocking...");
                selectedTipIds.forEach(id => {
                    const card = document.getElementById(`card-${id}`);
                    if(card) {
                        // Mock the reveal styling to match the free picks
                        card.classList.remove('border-slate-600');
                        card.classList.add('border-gold');
                        const rightBox = card.lastElementChild;
                        rightBox.className = "bg-gold text-navy font-black text-sm px-4 flex flex-col justify-center items-center text-center shadow-inner border-l border-golddark min-w-[100px]";
                        rightBox.innerHTML = `<span class="leading-tight">PREMIUM PICK</span>`;
                        // Remove checkbox
                        const checkbox = card.querySelector('input[type="checkbox"]');
                        if (checkbox) checkbox.remove();
                        // Fix padding
                        const leftBox = card.querySelector('.pl-10');
                        if (leftBox) leftBox.classList.remove('pl-10');
                    }
                });
                selectedTipIds.clear();
                currentTotal = 0;
                document.getElementById('checkout-bar').classList.add('translate-y-full');
            }, 3000);
        }
    </script>
</body>
</html>
